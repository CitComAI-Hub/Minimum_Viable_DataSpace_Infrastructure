# The chart's own PostgreSQL (operator + managed instance) is not used: the TIL
# connects to an external database, the shared instance of modules/postgres.
postgres-operator:
  enabled: false

managedPostgres:
  enabled: false

trusted-issuers-list:
  enabled: true
  fullnameOverride: "tir"
  service:
    port: 8080
  database:
    persistence: true
    dialect: POSTGRES
    host: "${database.host}"
    port: ${database.port}
    name: "${database.name}"
    username: "${database.username}"
    existingSecret:
      enabled: true
      name: "${database.secret_name}"
      key: "${database.password_key}"

  # With the "tailscale" class, the tls.hosts hostname is the Tailnet name:
  # https://<hostname>.<tailnet>.ts.net. The rules have no host: an Ingress served
  # by a ProxyGroup ignores rules whose host is not the full Tailnet FQDN.
  # The chart hardcodes the paths: TIR serves /v4/issuers (lookup) and TIL
  # serves /issuer (registration).
  ingress:
    tir:
      enabled: ${ingress_enabled}
      className: "${ingress_class_name}"
      annotations: ${jsonencode(ingress_annotations)}
      hosts:
        - host: ""
      tls:
        - hosts:
            - ${tir_hostname}
    til:
      enabled: ${ingress_enabled}
      className: "${ingress_class_name}"
      annotations: ${jsonencode(ingress_annotations)}
      hosts:
        - host: ""
      tls:
        - hosts:
            - ${til_hostname}
