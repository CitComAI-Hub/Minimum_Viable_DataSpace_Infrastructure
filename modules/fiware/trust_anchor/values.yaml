postgres-operator:
  enabled: ${postgres_operator_enabled}

managedPostgres:
  enabled: ${managed_postgres_enabled}

trusted-issuers-list:
  enabled: true
  fullnameOverride: "tir"
  service:
    port: 8080
  database:
    persistence: true
    host: "postgres"
    port: 5432
    name: "tildb"
    username: "til"
  # database:
  #   persistence: true
  #   dialect: POSTGRES
  #   username: postgres
  #   existingSecret:
  #     enabled: true
  #     name: postgres.postgres.credentials.postgresql.acid.zalan.do
  #     key: password
  #   host: postgres
  #   port: 5432
  #   name: tildb

  # Con la clase "tailscale" el hostname de tls.hosts es el nombre del dispositivo
  # en la Tailnet: https://<hostname>.<tailnet>.ts.net. El chart fija las rutas:
  # TIR publica /v4/issuers (consulta) y TIL publica /issuer (registro).
  ingress:
    tir:
      enabled: ${ingress_enabled}
      className: "${ingress_class_name}"
      hosts:
        - host: ${tir_hostname}
      tls:
        - hosts:
            - ${tir_hostname}
    til:
      enabled: ${ingress_enabled}
      className: "${ingress_class_name}"
      hosts:
        - host: ${til_hostname}
      tls:
        - hosts:
            - ${til_hostname}
