postgres-operator:
  enabled: ${postgres_operator_enabled}

managedPostgres:
  enabled: ${managed_postgres_enabled}

trusted-issuers-list:
  enabled: true
  fullnameOverride: "tir"
  service:
    port: 8080
  database:
    persistence: true
    host: "postgres"
    port: 5432
    name: "tildb"
    username: "til"
  # database:
  #   persistence: true
  #   dialect: POSTGRES
  #   username: postgres
  #   existingSecret:
  #     enabled: true
  #     name: postgres.postgres.credentials.postgresql.acid.zalan.do
  #     key: password
  #   host: postgres
  #   port: 5432
  #   name: tildb

  # With the "tailscale" class, the tls.hosts hostname is the device name in the
  # Tailnet: https://<hostname>.<tailnet>.ts.net. The chart hardcodes the paths:
  # TIR serves /v4/issuers (lookup) and TIL serves /issuer (registration).
  ingress:
    tir:
      enabled: ${ingress_enabled}
      className: "${ingress_class_name}"
      hosts:
        - host: ${tir_hostname}
      tls:
        - hosts:
            - ${tir_hostname}
    til:
      enabled: ${ingress_enabled}
      className: "${ingress_class_name}"
      hosts:
        - host: ${til_hostname}
      tls:
        - hosts:
            - ${til_hostname}
